name: Build WACRM Central package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'dist/wacrm-central.b64.*'
      - '.github/workflows/build-wacrm-central.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct package
        shell: bash
        run: |
          cat dist/wacrm-central.b64.* > /tmp/wacrm-central.b64
          base64 -d /tmp/wacrm-central.b64 > dist/wacrm-central-0.1.0.zip
          echo "53b8f1289b2e5b69d9c8d0ed47c12c9485a749d41266509f26efe153ad5ab874  dist/wacrm-central-0.1.0.zip" | sha256sum -c -

      - name: Commit package if changed
        shell: bash
        run: |
          if git diff --quiet -- dist/wacrm-central-0.1.0.zip && git ls-files --error-unmatch dist/wacrm-central-0.1.0.zip >/dev/null 2>&1; then
            echo "Package already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/wacrm-central-0.1.0.zip
          git commit -m "Build WACRM Central 0.1.0 package"
          git push
